<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4a16c4" />
    <title>You're offline | ETEN</title>
    <!-- Shown by the service worker when a page can't load. Self-contained
         (no network needed): inline styles, inline icon, system fonts. -->
    <style>
      :root {
        --bg: #f7f6fb;
        --panel: #ffffff;
        --ink: #17123d;
        --muted: #5e5a7d;
        --line: #eceaf4;
        --accent: #4a16c4;
        --accent-press: #2e0a86;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1622;
          --panel: #161f2e;
          --ink: #eaf0f8;
          --muted: #aebccf;
          --line: #253145;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 36px 28px;
        text-align: center;
      }
      svg {
        display: block;
        margin: 0 auto 20px;
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 13px 20px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        background: var(--accent-press);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .hint {
        margin: 16px 0 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        width="64"
        height="64"
        viewBox="0 0 64 64"
        aria-hidden="true"
        focusable="false"
      >
        <rect width="64" height="64" rx="16" fill="#4a16c4" />
        <g
          transform="translate(9 9) scale(0.426)"
          fill="#fff"
          stroke="#fff"
          stroke-width="12"
          stroke-linecap="round"
        >
          <circle cx="17" cy="17" r="15.5" />
          <circle cx="54" cy="17" r="15.5" />
          <circle cx="91" cy="17" r="15.5" />
          <circle cx="17" cy="54" r="15.5" />
          <circle cx="54" cy="54" r="15.5" />
          <circle cx="91" cy="54" r="15.5" />
          <circle cx="17" cy="91" r="15.5" />
          <circle cx="54" cy="91" r="15.5" />
          <circle cx="91" cy="91" r="15.5" />
          <line x1="54" y1="17" x2="17" y2="54" />
          <line x1="91" y1="17" x2="54" y2="54" />
          <line x1="54" y1="54" x2="17" y2="91" />
          <line x1="91" y1="54" x2="54" y2="91" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        ETEN needs an internet connection to load this page. Check your Wi-Fi or
        mobile data, then try again.
      </p>
      <button type="button" id="retry">Try again</button>
      <p class="hint" role="status" aria-live="polite" id="status">
        We'll reload automatically when you're back online.
      </p>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      window.addEventListener("online", function () {
        document.getElementById("status").textContent =
          "You're back online. Reloading...";
        location.reload();
      });
    </script>
  </body>
</html>
